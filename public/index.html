<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly Deal Live Matrix</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #121214; color: #e1e1e6; min-height: 100vh; padding: 20px; }
        
        /* Entrance Panel Layout */
        #auth-screen { max-width: 450px; margin: 80px auto; background: #202024; padding: 30px; border-radius: 8px; border: 1px solid #29292e; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .tab-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: #29292e; color: #a8a8b3; cursor: pointer; font-weight: bold; border-radius: 4px; }
        .tab-btn.active { background: #04d361; color: white; }
        .input-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        input { padding: 12px; background: #121214; border: 1px solid #29292e; border-radius: 4px; color: white; font-size: 16px; }
        .action-btn { width: 100%; padding: 14px; background: #04d361; border: none; color: white; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        
        /* Game Arena Canvas Layout */
        #game-screen { display: none; max-width: 1200px; margin: 0 auto; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; background: #202024; padding: 15px 20px; border-radius: 6px; margin-bottom: 20px; border-bottom: 3px solid #29292e; }
        .status-badge { background: #29292e; padding: 8px 16px; border-radius: 20px; font-weight: bold; }
        
        /* Dynamic Matrix Board Grid */
        .board-grid { display: grid; grid-template-rows: auto auto; gap: 20px; margin-bottom: 20px; }
        .zone { background: #202024; border: 1px solid #29292e; border-radius: 6px; padding: 15px; }
        .zone-title { font-size: 14px; text-transform: uppercase; color: #a8a8b3; margin-bottom: 10px; letter-spacing: 1px; }
        
        /* Card Hand Components */
        .card-row { display: flex; gap: 12px; overflow-x: auto; padding: 10px 0; min-height: 150px; }
        .card { width: 110px; height: 160px; border-radius: 6px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 2px solid transparent; transition: transform 0.2s; position: relative; }
        .card:hover { transform: translateY(-8px); border-color: white; }
        .card-name { font-size: 14px; text-shadow: 1px 1px 2px #000; }
        
        /* central control interface elements */
        .control-panel { display: flex; align-items: center; justify-content: center; gap: 20px; background: #202024; padding: 20px; border-radius: 6px; margin-top: 15px; }
        .deck-element { width: 100px; height: 140px; background: #41414d; border: 3px dashed #a8a8b3; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; text-align: center; font-weight: bold; }
        .deck-element.disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-finish { padding: 15px 30px; background: #da3731; border: none; color: white; font-weight: bold; font-size: 16px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- STAGE 1: AUTHENTICATION ROUTER WINDOW -->
    <div id="auth-screen">
        <h2 style="text-align:center; margin-bottom:20px;">🃏 Monopoly Deal Core</h2>
        <div class="tab-box">
            <button class="tab-btn active" id="tab-create" onclick="switchAuthTab('create')">Create Room</button>
            <button class="tab-btn" id="tab-join" onclick="switchAuthTab('join')">Join Room</button>
        </div>
        
        <div class="input-group">
            <label>Unique Room Name</label>
            <input type="text" id="room-id-input" placeholder="e.g., alpha_room">
        </div>
        <div class="input-group">
            <label>Security Password</label>
            <input type="password" id="room-pass-input" placeholder="••••">
        </div>
        
        <button class="action-btn" id="auth-action-btn" onclick="executeAuth()">Construct Grid</button>
    </div>

    <!-- STAGE 2: LIVE IN-GAME ARENA WINDOW -->
    <div id="game-screen">
        <div class="header-bar">
            <h3>Room: <span id="display-room-id">None</span></h3>
            <div class="status-badge" id="turn-indicator">Waiting for players...</div>
            <div id="action-counter">Actions Left: 3</div>
        </div>

        <div class="board-grid">
            <!-- SHARED ARENA: OPPONENT TABLE OVERVIEW -->
            <div class="zone">
                <div class="zone-title" id="opp-hand-counter">Opponent Table View (Hand Size: 0)</div>
                <div class="card-row" id="opponent-desk"></div>
            </div>

            <!-- SHARED ARENA: LOCAL PLAYER TABLE OVERVIEW -->
            <div class="zone">
                <div class="zone-title">Your Table Desk View</div>
                <div class="card-row" id="my-desk"></div>
            </div>
        </div>

        <!-- CONTROL DECK INTERACTION HOOD -->
        <div class="control-panel">
            <div class="deck-element" id="central-draw-deck" onclick="triggerServerDraw()">
                <span>DECK</span>
                <span id="deck-count-text" style="font-size:12px; margin-top:5px;">(50)</span>
            </div>
            
            <button class="btn-finish" onclick="triggerServerEndTurn()">End Current Turn</button>
        </div>

        <!-- PRIVATE WINDOW: LOCAL ACTIVE PLAYER CARD HAND -->
        <div class="zone" style="margin-top: 20px;">
            <div class="zone-title" id="my-hand-title">Your Private Hand (0 / 7 Cards)</div>
            <div class="card-row" id="my-hand"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>
</html>
